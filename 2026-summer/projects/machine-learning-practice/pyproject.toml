[project]
name = "machine-learning-practice"
version = "0.1.0"
description = "机器学习入门代码实践：从经典模型到 MLP、CNN 与自注意力"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.5",
]

[project.scripts]
ml-practice = "ml_practice.run_all:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_practice"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
